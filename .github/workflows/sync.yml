name: Sync Airbnb → Supabase

# Keeps Supabase current with the live Airbnb iCal feed on a schedule, then
# fills guest names from Gmail. The Gmail step is GATED on the GMAIL_APP_PASSWORD
# secret: until the operator sets it (see README → Live Gmail ingestion) AND a
# real booking email has validated the parser, the secret is unset and the step
# is skipped — so the cron keeps doing exactly the validated iCal sync.
# The Everline send stays manual (dashboard action), not automated here.
#
# Note: scheduled workflows run only from the default branch, and GitHub cron
# can lag 5–30 min. A repo with no commits for 60 days auto-pauses schedules.

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes (UTC)
  workflow_dispatch: {} # allow manual runs from the Actions tab / gh CLI

jobs:
  sync:
    runs-on: ubuntu-latest
    # Job-level so the Gmail step's `if:` can test it (secrets aren't available
    # in step `if` conditions directly).
    env:
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Sync iCal feed into Supabase
        run: npm run sync
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Service-role (secret) key: the sync writes server-side and must
          # bypass RLS (enabled in db/003_auth_rls.sql). Falls back to the anon
          # key only if the secret isn't set (won't write against RLS).
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Fill guest names from Gmail
        # Skipped until the app password is configured (README → Live Gmail ingestion).
        if: env.GMAIL_APP_PASSWORD != ''
        run: npm run names -- --gmail
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
